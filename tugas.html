<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Suit Interaktif</title>
    <style>
        :root {
            --card: #885b3f;
            --text: #f7f4eb;
            --text-muted: #c7b8a7;
            --primary: #a98158;
            --primary-hover: #8c6744;
            --border: #544033;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text);
        }
        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .btn {
            background-color: var(--primary);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 14px;
        }
        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Game Suit</h1>
        <p>DIpilih, dipilih</p>

        <button class="btn" onclick="pilihGame(1)">1. Suit Batu Gunting Kertas</button>
        <button class="btn" onclick="pilihGame(2)">2. Suit Gajah Orang Semut</button>
        <button class="btn" onclick="pilihGame(3)">3. Suit Jari (1 - 5)</button>

        <footer>Proyek Praktikum Pemrograman Web (PROWEB)</footer>
    </div>

    <script>
        function pilihGame(nomorGame) {
            let mauMainLagi = true;

            while (mauMainLagi) {
                if (nomorGame === 1) {
                    suitBatuGuntingKertas();
                } else if (nomorGame === 2) {
                    suitGajahOrangSemut();
                } else if (nomorGame === 3) {
                    suitJari();
                }
                mauMainLagi = confirm("Mau main lagi?");
            }
        }

        function suitBatuGuntingKertas() {
            let inputUser = prompt("GAME BATU GUNTING KERTAS\nMasukkan pilihan kamu (Batu / Gunting / Kertas):");
            
            if (inputUser === null) {
                alert("Yah, malah di-cancel.");
                return;
            }
            
            let userChoice = inputUser.trim().toLowerCase();
            userChoice = userChoice.charAt(0).toUpperCase() + userChoice.slice(1);

            if (userChoice !== 'Batu' && userChoice !== 'Gunting' && userChoice !== 'Kertas') {
                alert("Input gak valid. Coba masukin teks yang bener.");
                return;
            }

            const pilihanComp = ['Batu', 'Gunting', 'Kertas'];
            let compChoice = pilihanComp[Math.floor(Math.random() * 3)];

            let hasil = '';
            if (userChoice === compChoice) {
                hasil = 'SERI! Sama mulu nih.';
            } else if (
                (userChoice === 'Batu' && compChoice === 'Gunting') ||
                (userChoice === 'Gunting' && compChoice === 'Kertas') ||
                (userChoice === 'Kertas' && compChoice === 'Batu')
            ) {
                hasil = 'KAMU MENANG! Tumben bisa menang.';
            } else {
                hasil = 'KAMU KALAH! Gini doang kalah, kocak dah.';
            }

            alert("Hasil Pertandingan:\n\nKamu: " + userChoice + "\nKomputer: " + compChoice + "\n\n" + hasil);
        }

        function suitGajahOrangSemut() {
            let inputUser = prompt("GAME GAJAH ORANG SEMUT\nMasukkan pilihan kamu (Gajah / Orang / Semut):");
            
            if (inputUser === null) {
                alert("Yah, malah di-cancel.");
                return;
            }
            
            let userChoice = inputUser.trim().toLowerCase();
            userChoice = userChoice.charAt(0).toUpperCase() + userChoice.slice(1);

            if (userChoice !== 'Gajah' && userChoice !== 'Orang' && userChoice !== 'Semut') {
                alert("Input gak valid. Coba masukin teks yang bener.");
                return;
            }

            const pilihanComp = ['Gajah', 'Orang', 'Semut'];
            let compChoice = pilihanComp[Math.floor(Math.random() * 3)];

            let hasil = '';
            if (userChoice === compChoice) {
                hasil = 'SERI! Pilihan kita sama.';
            } else if (
                (userChoice === 'Gajah' && compChoice === 'Orang') ||
                (userChoice === 'Orang' && compChoice === 'Semut') ||
                (userChoice === 'Semut' && compChoice === 'Gajah')
            ) {
                hasil = 'KAMU MENANG! Hoki doang ini mah.';
            } else {
                hasil = 'KAMU KALAH! Gak ada bedanya, kalah juga.';
            }

            alert("Hasil Pertandingan:\n\nKamu: " + userChoice + "\nKomputer: " + compChoice + "\n\n" + hasil);
        }

        function suitJari() {
            let inputUser = prompt("GAME SUIT ANGKA JARI\nMasukkan jumlah jari (Angka 1 sampai 5):");
            
            if (inputUser === null) {
                alert("Yah, malah di-cancel.");
                return;
            }

            let userChoice = parseInt(inputUser);

            if (isNaN(userChoice) || userChoice < 1 || userChoice > 5) {
                alert("Input salah. Harus berupa angka 1 sampai 5.");
                return;
            }

            let compChoice = Math.floor(Math.random() * 5) + 1;

            let hasil = '';
            if (userChoice === compChoice) {
                hasil = 'SERI! Jari kita sama.';
            } else if (
                (userChoice > compChoice && !(userChoice === 5 && compChoice === 1)) || 
                (userChoice === 1 && compChoice === 5)
            ) {
                hasil = 'KAMU MENANG! Lumayan lah ya.';
            } else {
                hasil = 'KAMU KALAH! Kalah mekanik lu, cupu.';
            }

            alert("Hasil Pertandingan:\n\nKamu: " + userChoice + " Jari\nKomputer: " + compChoice + " Jari\n\n" + hasil);
        }
    </script>
</body>
</html>
